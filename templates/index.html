<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- This title is set by the 'page_title' variable from Python -->
    <title>My Movie Collection</title>
    <!-- Link assumes 'style.css' will be in the 'website' folder -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Matches '.list-movies-title' style -->
    <div class="list-movies-title">
        <h1>My Movie Collection</h1>
    </div>

    <main>
        <!-- Check if the 'movies' dictionary is available -->
        
            <!-- Matches '.movie-grid' style -->
            <ol class="movie-grid">
                <!-- Loop through each movie from the Python dictionary -->
                
                    <!-- Matches '.movie' style -->
                    <li class="movie">
                        <!-- Matches '.movie-poster' style. Uses DYNAMIC data -->
                        <img class="movie-poster"
                             src="https://m.media-amazon.com/images/M/MV5BYzZmZWViM2EtNzhlMi00NzBlLWE0MWEtZDFjMjk3YjIyNTBhXkEyXkFqcGc@._V1_SX300.jpg"  
                             alt="Batman Poster" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="poster-placeholder" style="display: none; text-align: center; color: #999; font-size: 0.8em; height: 193px; width: 128px; border: 1px solid #ccc; box-sizing: border-box; padding-top: 80px;">No Poster</div>

                        <!-- Matches '.movie-title' style. Uses DYNAMIC data -->
                        <div class="movie-title">Batman</div> 
                        <!-- Matches '.movie-year' style. Uses DYNAMIC data -->
                        <div class="movie-year">1989</div> 
                        <!-- Rating display. Uses DYNAMIC data -->
                        <div class="movie-rating" style="font-size: 0.8em; text-align: center; color: #555;">
                           Rating: 7.5 
                        </div>
                    </li>
                
                    <!-- Matches '.movie' style -->
                    <li class="movie">
                        <!-- Matches '.movie-poster' style. Uses DYNAMIC data -->
                        <img class="movie-poster"
                             src="https://m.media-amazon.com/images/M/MV5BOGUwMDk0Y2MtNjBlNi00NmRiLTk2MWYtMGMyMDlhYmI4ZDBjXkEyXkFqcGc@._V1_SX300.jpg"  
                             alt="Star Wars: Episode IV - A New Hope Poster" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="poster-placeholder" style="display: none; text-align: center; color: #999; font-size: 0.8em; height: 193px; width: 128px; border: 1px solid #ccc; box-sizing: border-box; padding-top: 80px;">No Poster</div>

                        <!-- Matches '.movie-title' style. Uses DYNAMIC data -->
                        <div class="movie-title">Star Wars: Episode IV - A New Hope</div> 
                        <!-- Matches '.movie-year' style. Uses DYNAMIC data -->
                        <div class="movie-year">1977</div> 
                        <!-- Rating display. Uses DYNAMIC data -->
                        <div class="movie-rating" style="font-size: 0.8em; text-align: center; color: #555;">
                           Rating: 8.6 
                        </div>
                    </li>
                
                    <!-- Matches '.movie' style -->
                    <li class="movie">
                        <!-- Matches '.movie-poster' style. Uses DYNAMIC data -->
                        <img class="movie-poster"
                             src="https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_SX300.jpg"  
                             alt="The Dark Knight Poster" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="poster-placeholder" style="display: none; text-align: center; color: #999; font-size: 0.8em; height: 193px; width: 128px; border: 1px solid #ccc; box-sizing: border-box; padding-top: 80px;">No Poster</div>

                        <!-- Matches '.movie-title' style. Uses DYNAMIC data -->
                        <div class="movie-title">The Dark Knight</div> 
                        <!-- Matches '.movie-year' style. Uses DYNAMIC data -->
                        <div class="movie-year">2008</div> 
                        <!-- Rating display. Uses DYNAMIC data -->
                        <div class="movie-rating" style="font-size: 0.8em; text-align: center; color: #555;">
                           Rating: 9.0 
                        </div>
                    </li>
                
                    <!-- Matches '.movie' style -->
                    <li class="movie">
                        <!-- Matches '.movie-poster' style. Uses DYNAMIC data -->
                        <img class="movie-poster"
                             src="https://m.media-amazon.com/images/M/MV5BMGZkMmI5ZjMtNWRjMy00NmI2LTk3NzQtNjZhOGMyNmRjZGNjXkEyXkFqcGc@._V1_SX300.jpg"  
                             alt="The Joker Poster" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="poster-placeholder" style="display: none; text-align: center; color: #999; font-size: 0.8em; height: 193px; width: 128px; border: 1px solid #ccc; box-sizing: border-box; padding-top: 80px;">No Poster</div>

                        <!-- Matches '.movie-title' style. Uses DYNAMIC data -->
                        <div class="movie-title">The Joker</div> 
                        <!-- Matches '.movie-year' style. Uses DYNAMIC data -->
                        <div class="movie-year">1960</div> 
                        <!-- Rating display. Uses DYNAMIC data -->
                        <div class="movie-rating" style="font-size: 0.8em; text-align: center; color: #555;">
                           Rating: 6.5 
                        </div>
                    </li>
                 
            </ol>
         
    </main>

</body>
</html>
